name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra test
      - run: uv run --frozen python -m compileall -q src ops scripts tests tools
      - name: Check public repository boundary
        run: uv run --frozen python tools/quality/check_public_boundary.py --root .
      - name: Run privilege-boundary unit tests
        run: sudo --preserve-env=UV_PYTHON,UV_CACHE_DIR env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest -q --ignore=tests/browser

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra test
      - run: uv run --frozen playwright install chromium
      - run: uv run --frozen pytest -q tests/browser

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
